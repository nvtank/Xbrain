<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Aurora</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orb1: #7c3aed;
    --orb2: #0ea5e9;
    --orb3: #10b981;
    --orb4: #f59e0b;
    --glass-bg: rgba(10, 10, 20, 0.55);
    --glass-border: rgba(255,255,255,0.08);
    --msg-user-bg: linear-gradient(135deg, #7c3aed, #6366f1);
    --msg-ai-bg: rgba(255,255,255,0.06);
    --input-bg: rgba(255,255,255,0.05);
    --text-main: #f0f0ff;
    --text-muted: rgba(240,240,255,0.5);
    --accent: #a78bfa;
    --send-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
  }

  body {
    font-family: 'Sora', sans-serif;
    background: #060614;
    color: var(--text-main);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Animated background ── */
  .bg-canvas {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .bg-canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 30%, rgba(124,58,237,0.35) 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 80% 70%, rgba(6,182,212,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 60% 10%, rgba(16,185,129,0.2) 0%, transparent 60%);
    animation: shift 14s ease-in-out infinite alternate;
  }

  @keyframes shift {
    0%   { transform: scale(1)   rotate(0deg);   }
    50%  { transform: scale(1.08) rotate(3deg);  }
    100% { transform: scale(1.04) rotate(-2deg); }
  }

  /* grid overlay */
  .bg-canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* floating orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    will-change: transform;
  }
  .orb1 { width: 480px; height: 480px; background: var(--orb1); top: -120px; left: -80px; animation: float1 20s ease-in-out infinite; }
  .orb2 { width: 380px; height: 380px; background: var(--orb2); bottom: -60px; right: -60px; animation: float2 25s ease-in-out infinite; }
  .orb3 { width: 260px; height: 260px; background: var(--orb3); top: 40%; left: 55%; animation: float3 18s ease-in-out infinite; }
  .orb4 { width: 200px; height: 200px; background: var(--orb4); top: 70%; left: 10%; animation: float4 22s ease-in-out infinite; opacity: 0.3; }

  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1);         }
    33%      { transform: translate(60px,40px) scale(1.05); }
    66%      { transform: translate(-30px,80px) scale(0.95); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1);          }
    40%      { transform: translate(-80px,-50px) scale(1.08); }
    70%      { transform: translate(40px,-20px) scale(0.96);  }
  }
  @keyframes float3 {
    0%,100% { transform: translate(0,0);           }
    50%      { transform: translate(-60px, 70px);  }
  }
  @keyframes float4 {
    0%,100% { transform: translate(0,0) rotate(0deg);   }
    50%      { transform: translate(80px,-40px) rotate(180deg); }
  }

  /* ── Particles ── */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: white;
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { opacity: 0;    transform: translateY(0)   scale(0.5); }
    15%  { opacity: 0.7; }
    85%  { opacity: 0.3; }
    100% { opacity: 0;    transform: translateY(-120vh) scale(1); }
  }

  /* ── Chat layout ── */
  .chat-wrapper {
    position: relative;
    z-index: 10;
    width: min(760px, 96vw);
    height: min(88vh, 820px);
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 32px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(124,58,237,0.12);
    animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  /* ── Header ── */
  .chat-header {
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03);
    flex-shrink: 0;
  }
  .header-avatar {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: var(--msg-user-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 16px rgba(124,58,237,0.5);
    flex-shrink: 0;
  }
  .header-text h2 {
    font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, #c4b5fd, #67e8f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-text p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    margin-left: auto;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { box-shadow: 0 0 6px #10b981; }
    50%      { box-shadow: 0 0 18px #10b981, 0 0 30px rgba(16,185,129,0.4); }
  }

  /* ── Messages ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .message {
    display: flex;
    gap: 10px;
    animation: msgIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    max-width: 82%;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.ai   { align-self: flex-start; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }
  .message.ai   .msg-avatar { background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.3); }
  .message.user .msg-avatar { background: rgba(6,182,212,0.2);  border: 1px solid rgba(6,182,212,0.3); }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    word-break: break-word;
  }
  .message.user .msg-bubble {
    background: var(--msg-user-bg);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 4px 24px rgba(124,58,237,0.35);
  }
  .message.ai .msg-bubble {
    background: var(--msg-ai-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    border-bottom-left-radius: 5px;
    backdrop-filter: blur(8px);
  }

  .citations {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .citation-chip {
    position: relative;
    font-size: 11px;
    color: var(--text-main);
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.06);
    cursor: default;
  }

  .citation-tooltip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%);
    width: min(320px, 70vw);
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(10, 12, 24, 0.95);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    font-size: 12px;
    line-height: 1.55;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform-origin: bottom center;
    white-space: normal;
    z-index: 10;
  }

  .citation-chip:hover .citation-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
  }

  /* blinking cursor */
  .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 3px;
    border-radius: 2px;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Input area ── */
  .chat-input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.02);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-wrapper {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: rgba(167,139,250,0.4);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
  }
  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    color: var(--text-main);
    resize: none;
  }
  .chat-input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 44px; height: 44px;
    border: none; border-radius: 14px;
    background: var(--send-gradient);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    flex-shrink: 0;
  }
  .send-btn:hover  { transform: scale(1.07); box-shadow: 0 6px 28px rgba(124,58,237,0.6); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ── Typing indicator ── */
  .typing-dots {
    display: inline-flex; gap: 5px; align-items: center; height: 20px;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0);    opacity: 0.4; }
    40%          { transform: translateY(-6px); opacity: 1;   }
  }
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-canvas">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
  <div class="particles" id="particles"></div>
</div>

<!-- Chat UI -->
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="header-avatar">✦</div>
    <div class="header-text">
      <h2>Aurora AI</h2>
      <p>Trợ lý thông minh của bạn</p>
    </div>
    <div class="status-dot" title="Đang hoạt động"></div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message ai">
      <div class="msg-avatar">✦</div>
      <div class="msg-bubble">
        Xin chào! Tôi là Aurora. Tôi có thể giúp gì cho bạn hôm nay? ✨
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <input
        class="chat-input"
        id="user-input"
        placeholder="Nhắn gì đó với Aurora..."
        autocomplete="off"
      />
    </div>
    <button class="send-btn" id="send-btn" type="button" title="Gửi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ── Particles ──
  const pContainer = document.getElementById('particles');
  const colors = ['#a78bfa','#67e8f9','#6ee7b7','#fbbf24','#f9a8d4'];
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    p.style.cssText = `
      left:${Math.random()*100}%;
      bottom:${Math.random()*-20}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${8+Math.random()*20}s;
      animation-delay:${Math.random()*15}s;
      opacity:0;
    `;
    pContainer.appendChild(p);
  }

  // ── Chat logic ──
  const msgContainer = document.getElementById('chat-messages');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  let busy = false;

  const API_URL = 'http://localhost:8001/agent-chat';
  const API_KEY = 'super-secret-key';
  const SESSION_ID_KEY = 'aurora_session_id';

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    e.stopPropagation();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (!busy) {
        sendMessage(e);
      }
    }
  });

  sendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!busy) {
      sendMessage(e);
    }
  });

  function getSessionId() {
    let sessionId = localStorage.getItem(SESSION_ID_KEY);
    if (!sessionId) {
      const uuid = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `session-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      sessionId = uuid;
      localStorage.setItem(SESSION_ID_KEY, sessionId);
    }
    return sessionId;
  }

  const responses = [
    "Đó là một câu hỏi thú vị! AI tạo văn bản thường sinh ra các token một cách tuần tự. Việc hiển thị streaming như thế này tạo cảm giác tự nhiên hơn rất nhiều so với chờ toàn bộ phản hồi. Người dùng có thể đọc trong khi tôi vẫn đang \"nghĩ\".",
    "Giao diện này được xây dựng bằng HTML, CSS và JavaScript thuần — không thư viện UI nào cả. Hiệu ứng glassmorphism đến từ backdrop-filter: blur(), còn background bay bay là sự kết hợp giữa các orb gradient + lớp particle nổi lên.",
    "Thiết kế Aurora theo phong cách dark cosmic: màu tím — xanh lạnh tạo cảm giác sâu lắng, kết hợp glassmorphism để chat window trông như đang lơ lửng trong không gian. Mỗi chi tiết đều có dụng ý.",
    "Tất nhiên! Hiệu ứng streaming mô phỏng bằng setInterval() — nối từng ký tự một với tốc độ ~20ms. Trong hệ thống thực, đây sẽ là Server-Sent Events hoặc WebSocket nhận token từ model.",
  ];

  function addMessage(text, role, streaming = false) {
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'ai' ? '✦' : '◉';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (streaming) {
      bubble.innerHTML = `<span class="content"></span><span class="cursor"></span>`;
    } else {
      bubble.textContent = text;
    }
    
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgContainer.appendChild(wrap);
    scrollDown();
    return bubble;
  }

  function attachCitations(bubble, citations = []) {
    if (!citations.length) return;

    const list = document.createElement('div');
    list.className = 'citations';

    citations.forEach((item) => {
      const chip = document.createElement('span');
      chip.className = 'citation-chip';
      chip.textContent = item.source;
      const tooltip = document.createElement('span');
      tooltip.className = 'citation-tooltip';
      tooltip.textContent = item.snippet || '';
      chip.appendChild(tooltip);
      list.appendChild(chip);
    });

    bubble.appendChild(list);
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message ai';
    wrap.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '✦';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgContainer.appendChild(wrap);
    scrollDown();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollDown() {
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function lock(on) {
    busy = on;
    sendBtn.disabled = on;
    input.disabled = on;
  }

  async function sendMessage(event) {
    if (event) {
      event.preventDefault();
    }
    const text = input.value.trim();
    if (!text || busy) return;

    addMessage(text, 'user');
    input.value = '';
    lock(true);
    addTyping();

    try {
      // Gửi request tới API
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': API_KEY,
        },
        body: JSON.stringify({
          session_id: getSessionId(),
          query: text,
        }),
      });
      
      if (!response.ok) {
        throw new Error(`Mạng bị lỗi hoặc server không phản hồi (Status: ${response.status})`);
      }

      let data;
      try {
        data = await response.json();
      } catch (parseError) {
        const fallbackText = await response.text();
        throw new Error(fallbackText || 'Phản hồi API không phải JSON hợp lệ');
      }
      removeTyping();
      
      // Xử lý stream text với dữ liệu answer từ API
      const bubble = addMessage('', 'ai', true);
      const content = bubble.querySelector('.content');
      const cursor  = bubble.querySelector('.cursor');
      
      // Dùng answer được trả về từ phía API
      const reply = data.answer || "Xin lỗi, tôi không có câu trả lời cho vấn đề này.";
      const citations = data.citations || [];
      
      streamText(reply, content, cursor, () => {
        attachCitations(bubble, citations);
      });

    } catch (error) {
      removeTyping();
      const bubble = addMessage('', 'ai', true);
      const content = bubble.querySelector('.content');
      const cursor  = bubble.querySelector('.cursor');
      streamText(`Lỗi kết nối API: ${error.message}`, content, cursor);
    }
  }

  function streamText(full, el, cursor, onDone) {
    let i = 0;
    const iv = setInterval(() => {
      if (i < full.length) {
        el.textContent += full[i++];
        scrollDown();
      } else {
        clearInterval(iv);
        cursor.style.display = 'none';
        lock(false);
        input.focus();
        if (typeof onDone === 'function') {
          onDone();
        }
      }
    }, 18);
  }
</script>
</body>
</html>
